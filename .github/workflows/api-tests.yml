name: API Tests and GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore test database
        run: cp mockApi/db_back_up.yaml mockApi/db_stage.yaml

      - name: Start local API
        run: |
          npx yaml-server \
            --hotReload=off \
            --autoStart=off \
            --port 3000 \
            --database ./mockApi/db_stage.yaml > api-server.log 2>&1 &

      - name: Wait for local API
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3000/products > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 1
          done

          echo "API did not start"
          cat api-server.log
          exit 1

      - name: Run Newman and generate report
        run: |
          mkdir -p public
          npx newman run store.collection.json \
            -e store.environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export public/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

  deploy:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4